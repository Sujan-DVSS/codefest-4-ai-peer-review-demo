name: ReviewIQ

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    uses: Sujan-DVSS/ai-context-pr-reviewer/.github/workflows/reusable-review.yml@main
    secrets:
      LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_BEARER_TOKEN: ${{ secrets.JIRA_BEARER_TOKEN }}
      REVIEWIQ_APP_ID: ${{ secrets.REVIEWIQ_APP_ID }}
      REVIEWIQ_APP_PRIVATE_KEY: ${{ secrets.REVIEWIQ_APP_PRIVATE_KEY }}
    with:
      story-provider: auto
      stories-dir: stories
      jira-base-url: https://sidekickzen.atlassian.net
      fail-on: medium
      llm-provider: litellm
      llm-required: true
